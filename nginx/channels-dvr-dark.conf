# Dark-mode front door for Channels DVR admin.
#
# CDVR itself keeps running unchanged (light mode, untouched) on whatever
# port $cdvr_address below points at. This block listens on a second port
# (see "listen" below) and proxies to CDVR, injecting a dark-mode
# stylesheet into every HTML response. No CDVR config changes, no firewall
# changes — CDVR's own port is still the normal light-mode URL, this
# block's port is the dark-mode URL.
#
# Install:
#   cp channels-dvr-dark.conf /etc/nginx/conf.d/channels-dvr-dark.conf
#   mkdir -p /etc/nginx/channels-dark
#   cp dark-mode.css /etc/nginx/channels-dark/dark-mode.css
#   nginx -t && systemctl reload nginx
#
# This file must load in the http{} context (true for both
# /etc/nginx/conf.d/*.conf and /etc/nginx/sites-enabled/* on stock nginx.conf),
# since it defines a map{} directive at the top level.

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    # Bare "listen 8088;" binds only the IPv4 wildcard (0.0.0.0:8088) — nginx
    # never binds IPv6 unless a separate "listen [::]:PORT;" line is added,
    # so none is needed here to stay IPv4-only.
    #
    # To bind one specific IPv4 address instead of all interfaces, replace
    # the line below with, e.g.: listen 172.31.31.195:8088;
    listen 8088;
    server_name _;

    # The injected stylesheet itself
    location = /__cdvr-dark-mode__.css {
        alias /etc/nginx/channels-dark/dark-mode.css;
        add_header Cache-Control "no-cache";
    }

    location / {
        # CDVR's full address (scheme included). One variable, used both
        # to actually reach CDVR (proxy_pass) and to recognize/strip its
        # self-baked URLs from responses (sub_filter below) — they must
        # always agree, so there is only one place to change, scheme
        # included (e.g. if CDVR's own port were ever put behind TLS).
        # Hardcoded to loopback for simplicity/reliability of this
        # same-box hop. CDVR can be configured (via its own -host flag) to
        # not listen on loopback at all, or to run on a different
        # box/container entirely — in either case, change this line to
        # CDVR's real reachable address instead.
        #
        # Keep the literal string "127.0.0.1:8089" as the default here:
        # community Docker deployments of this proxy sed-replace exactly
        # that string with host.docker.internal:8089 when CDVR runs
        # natively and this proxy runs containerized. Changing the default
        # (e.g. to a variable-derived value) would make that substitution
        # silently no-op, breaking those setups without any error.
        set $cdvr_address http://127.0.0.1:8089;
        proxy_pass $cdvr_address;
        proxy_http_version 1.1;

        # WebSocket support (CDVR uses it for live status/progress updates)
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        # Ask CDVR not to gzip so sub_filter can rewrite the HTML body
        proxy_set_header Accept-Encoding "";

        # Don't buffer responses — this proxy also carries live TV streams
        # and status updates, which buffering would delay.
        proxy_buffering off;

        # CDVR bakes its own real address into absolute URLs it hands
        # back — notably the HLS master playlist for live TV/recording
        # playback, which points the player straight at CDVR instead of
        # back through this proxy, breaking playback through the dark-mode
        # URL. The Channels DVR developers' own guidance for this
        # (reverse-proxy setups aren't otherwise supported, and rewriting
        # the Host header trips extra auth prompts) is to rewrite it via
        # sub_filter, same mechanism as the CSS injection below. Stripping
        # the whole scheme+host+port down to just "/" (rather than only
        # swapping the port) means the client's next request naturally
        # comes back to whatever origin it used for the manifest itself —
        # this box, this box on a different port, or a different box
        # entirely if nginx and CDVR are ever split apart.
        sub_filter_types application/x-mpegurl;
        sub_filter_once off;
        sub_filter '$cdvr_address/' '/';
        sub_filter '</head>' '<link rel="stylesheet" href="/__cdvr-dark-mode__.css">\n</head>';
    }
}
